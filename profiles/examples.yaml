# 例题册 / 只有例题的讲义：题面后面紧跟「解：」「证明：」
# 已验证两轮：合成样张（2 页 5 例）+ 真书（某线代讲义扫描件，
# 线代部分 p4-70，69 道例题，切完一份 27 页的做题本）。
# 跟讲义（handout）的区别：讲义要的是章末课后题，这里要的是正文里的例题。
# 两者都有的书会被判成 handout（课后题更常见），要做例题就套下面 config 段。
id: examples
label: 例题册（正文里的「例 1.2」+ 紧跟解答）
verified: true
sample: 某线代讲义 p4-70（扫描件 · 69 例 · 6 章）
route: 例题正则切题干；cut_stop_patterns 让切点停在「【详解】/解：」上方，题图里不带答案
room: standard
when:
  kind: pdf
  text_layer: ok
  pages: [2, 600]
  # 不拿「有题页比例」当判据：例题的题号不是数字开头，通用数字正则量不到它，
  # 反而把「1.1 连续函数」这种小节号当成题号，比例恒为 1.0——就成了
  # 「要用例题正则才能算对比例，要比例对才认得出是例题」的死循环。
  # 例题这类靠「例」字标题的密度认，稳得多。
  chars_per_page: [300, 4000]
  head_hits:
    例题: [3, 999]
    习题: [0, 0]
  two_col: false

# 这几条会直接被 intake 写进 intake.yaml —— 认出来就用得上，不用手抄正则
config:
  question_patterns:
    # 括号里的「例X.Y」在扫描件里有三种长相：【例1.1】、[例1.1]、（例1.1）——
    # 少认一种就整题丢失（实测「（例1.3）（2014，」漏了一道）。分隔号同理，
    # 句点常被认成逗号。
    - '^\s*[【\[（(]?\s*例\s*(\d+)\s*[.．,，\-]\s*(\d+)'
  cut_stop_patterns:
    # 「【详解】」是这类讲义最主流的答案标记，比「解：」更常见
    - '^\s*[【\[]\s*(?:详解|解析|解答|证明|分析|点评)\s*[】\]]?'
    - '^\s*(?:解|证明|证|分析|点评|评注)\s*[：:]'
  ignore_patterns:
    - '^\s*(?:定理|引理|推论|性质|定义)\s*\d'
  # 讲义为了给大矩阵让位会把「【例2.8】设 A=[…]」整行右移二三十 pt，
  # 正文（下一行）仍在版心左沿；再加上奇偶页版心差十几 pt，成品上每道题的
  # 题号停在不同的 x 上，翻起来像没对齐。打开这条，crop.py 把题号那一行
  # 单独左移回正文左沿（只动那一行、只往左、上限 60pt）。
  align:
    first_line_flush: true

expect:
  题数: 例题数（每页 1–4 道），一本书通常几十到一两百道
  成品页数: 约 目录 1 页 + 题数 ÷ 3
accept: 题图里不能出现「【详解】」「解：」「证明：」——出现了就是切点没停住，答案印在题目下面，这本废了
pitfalls:
  - "切点必须停在解答开头。只在下一个「例」处切，题图会把解答一起带上——做题本上答案已经印在题干下面，等于没做。用 cut_stop_patterns 停在「【详解】/解：/证明：」上方"
  - "「解」字开头不一定是解答：题库里「解方程」「解不等式」开头的题干也会命中。cut_stop_patterns 要求「解」后面紧跟冒号（解：/解:），而且只在例题路线打开，真题册默认关"
  - "解答跨页时，下一页页首是答案的续文。common.HEAD_STOP_RE 会把以「解/证明/分析」开头的页首当成别人家的正文丢掉，不会接回上一题"
  - "例题编号写法很多：例1.2 / 例 1.2 / 【例1.2】/ （例1.2）/ 例1-2 / 例1,2（句点被 OCR 认成逗号）。括号那层必须放过【 [ （ 三种，少一种就整题消失"
  - "扫描件的题号从 x≈34 起排，默认 strip_x0=40 会把「【」切掉，整页题一道都认不出来——先把 strip_x0 调到 26-30 再下结论说「这页没题」"
  - "扫描件版心右沿不能按正文对齐取（正文到 448，但公式和长括注会探到 470-494）：按 448 切会把「取值范围」的最后一个字咬掉半个。取到页宽-5"
  - "例题的题号常与一个「高个子墨块」（多行矩阵、行列式）的中间行齐平，吸附出来的上边界会切在块内部，导致矩阵少掉上面几行——不是切歪半行，是整行消失。segment_ocr.block_top 用「墨带比一行字（18pt）高」判，退到块顶"
  - "页底的页码绶带（本书 y≈672-700）会被 ink_bottom 当成正文，末题的图里焊着一个页码框。content_bottom_margin 要给到 60 而不是默认 45"
  - "讲义按「第一章 行列式」分章时，章名印在页中部、标题整个落在左栏条带之外（条带里只剩「第五章」三个字）。章名和页段写进配置的 chapters:，stamp_chapters 按页盖，成品才有目录和页眉右上的章名"
  - "例题常带「分析：」引导，那是题干的一部分还是答案的开头，看原书——本项目假设「分析」属于答案侧（要和不要各占一半的书写习惯存在，切歪了在 qa 联系表上一眼能看出）"
  - "首行归左（align.first_line_flush）别按「第一条墨带」认题号：题号竖向居中排在多行矩阵左侧时，第一条墨带是矩阵的首行。照第一条挪会把行列式第一行单独抽走，整块散架（例1.2 实测直接废图）。认带只能靠题号框的纵向位置，所以 segment_ocr 把 label_box 一起存下来"
  - "横向只裁左沿、不裁右沿：layout 按版心宽度等比缩放每张题图，图宽不一缩放比就不一，上一题的字会比下一题大一圈。右沿留着，全本画布再补到同一宽度（crop.py 末尾统一 pad）"
  - "算左沿的 ink_box 必须传二值化阈值（默认 200），不能吃它自己的默认 246：扫描件四周一圈 210-245 的浅灰影在 246 下全是「墨」，左沿永远算出 0，横向归零等于没做——69 张图当时全白跑，成品上表现为题号忽左忽右挪 22pt"
  - "扫描灰尘只有 1-2 px，一颗就能把 ink_box 的左沿拉到正文左边（例2.8 在 x=44 有颗斜向 2px 灰点、每列只有 1 个墨点，左沿从 94 掉到 44，整题右边白留 22pt）。ink_box 因此要求「一列 ≥2 个墨点」才算数；真遇到 ≥2 点高的竖条灰再往上调 min_col，代价是右边细边会被多裁一点"
  - "扫描件里行列式竖线、矩阵大括号会从上到下贯穿，把所有行粘成一条墨带，首行归左于是静默失效（例1.1 的 292px 图被当成一条带）。ink_bands 先剔除「墨量 ≥ 80% 图高」的竖线列再分带，算左沿时仍用原图"
