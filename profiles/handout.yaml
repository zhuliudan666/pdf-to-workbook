# 讲义 / 教材：正文占九成，题只在每章末尾（课后习题）
# 验证过的真书：某运筹学教材（第 4 版）—— 561 页教材，15 章课后习题共 45 页，切出 173 题，
#   章章连续（2.1–2.11、3.1–3.11 … 16.1–16.14），切点质检干净，验收通过。
#   这本是扫描件、无文字层，走的是 segment_ocr.py。
id: handout
label: 讲义 / 教材（正文为主，每章末尾有课后题）
verified: true
sample: 某运筹学教材 15 章课后习题 · 45 页 173 题（扫描件，走 OCR）
route: 先圈出课后题页段（扫描件直接 OCR 目录页，有文字层用 find_exercises.py），再按页段走 segment_ocr.py / segment.py
room: standard
when:
  kind: pdf
  # 文字层两种都收：教材多半是扫描件（none），少数是电子版（ok）
  text_layer: [ok, none]
  pages: [4, 600]
  pages_with_marks_ratio: [0.0, 0.7]
  # 扫描件读不到字，chars_per_page 就是 0；别把 0 挡在外面
  chars_per_page: [0, 4000]
  head_hits:
    习题: [1, 99]
  two_col: false
# 认出来后写进 intake.yaml 的部分。题号正则（^数字.）不用换——课后题就是普通编号；
# 要加的是「正文里的编号一律不算题」：定理 1.1 / 例 1.2 / 定义 1.3 / 「1.1 小节名」。
# pages 和 chapters 没法预置（得看这本书），由 find_exercises.py --patch 补。
config:
  ignore_patterns:
    - '^\s*(定理|引理|推论|性质|定义|例|证明|证|解|图|表|公式)\s*\d'
    - '^\s*\d+\s*[.．]\s*\d+\s+\S'
  # 教材课后题的题号就是「章.序」两级；正文里的定理/例子也是两级，只能靠章号锚定分开：
  # 第9章的习题一定叫 9.x，正文解释段里的「（1）（2）（3）」再像题号也不算。
  ocr:
    loose_numbers: true

expect:
  题数: 只有课后题，通常几十到两百道，远少于正文编号数
  成品页数: 约 每章 1 页扉页 + 题数 ÷ 3.5
accept: 圈出的章数对得上目录、每题都是「习题」而不是定理/例题、章节层级只保留章、题图里不许出现整段课文
pitfalls:
  - "正文编号会被当题号：定理 1.1 / 例 1.2 / 公式 (1.3) 全都命中题号正则。必须先限页段，再加 ignore_patterns：^\\s*(定理|例|证|解|图|表)\\s*\\d"
  - "正文解释段里的「（1）（2）（3）」会被读成题号，把这一章第一个题号定成「3」，于是 9.1–9.6 全被判「编号级数不同」删光（某运筹学教材第9章实测：整章只切出 2 道假题）。现在配了 chapters（「第N章 …」）就按章号锚定：本章真有一批 N.x 才只认 N.x"
  - "章内的小节标题「16.7.2 转折概率」会被两级正则吃成「16.7」，顶替真题号的位置，真 16.7 判重、16.1–16.6 判往回走（第16章 14 题只剩 8 题）。判据：题号行后面还跟着「.数字」的一律不算题号（看整行，不能看 label）"
  - "「10.4」被读成「10.43」这类脏号，会让后面的 10.5–10.18 全部「不大于上一题」被删（第10章 18 题只剩 4 题）。判据：下一题正好是「上一题+2」时，本题按「上一题+1」更正，会打印「题号纠正」"
  - "缺口会跨页：「3.6」在页底、「3.8」在下页页顶，中间那道 3.7 被表格挤丢。补漏要同时扫「上一题→页底」和「页顶→下一题」两段，且补到的题号必须与上下题写法一致（数字换成 # 后相等），否则正文小问会成群混进来"
  - "章末最后一题的图会吃到后面整页课文（定义 / 定理 3.19 / 习题 3.1）。根因是跨页合并按「上一个选中页」判续页——讲义页段是离散的（3,6,9,12），p3 的下一张选中页是 p6，中间夹着整章正文。已在 common.build_questions 加两道闸：续页必须物理相邻，且页首不能以 定义/定理/第X章/习题 开头。回归见 selftest 的 check_handout"
  - "课后题每章从 1 重排，文本层路线又没有 chapter 字段，structural 会把全书同组，4 章 × 5 题报出 5 条假高危（真断了反而看不见）。必须把 chapters 写进配置，segment 按页段盖章名"
  - "课后题小节标题可能不统一（习题 / 练习 / 课后习题 / 思考题），自动圈会漏章。漏了就翻目录给页码范围，parse_pages 支持多段 12-14,58-61"
  - "561 页的教材别整本 OCR（一趟十几分钟）。先 OCR 目录那两三页，从「习题」条目读出每章的页码，再圈页段；目录读出来是「第2章…69」，69 就是起始页"
  - "有的章根本没有课后习题（某运筹学教材第7章、绪论、参考书目），页段就别圈，否则会切出一堆正文"
  - "讲义常见插图串栏、例题跨页，切点判据本身没问题，但图注容易被切给上一题——看 qa.csv 的「切穿底」"
  - "圈页段时章标题停在下一页：习题在 p3、第 2 章标题在 p4，早期实现圈成 p3-4，把 p4 整页定理当题切。判据已改为「下一段是章标题 → 结束页 = 章标题页 - 1」"
