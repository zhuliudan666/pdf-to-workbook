# 双栏：左右两栏独立成流。本流水线**不支持**，认出来是为了拦住，不是硬做。
# 验证过的样本：合成双栏样张（3 页 × 2 栏 × 6 题）
id: two-col
label: 双栏版式（当前不支持，会拦下）
verified: true
sample: 合成双栏样张 3 页（36 题，实测只认出 18 道）
route: 停。先确认是哪一种双栏，再决定走法
room: standard
when:
  kind: pdf
  two_col: true
expect:
  题数: 条带 OCR 只认出一半，别拿它当预期
accept: 不适用——这条路不该产出成品
pitfalls:
  - "根因在 ink_blocks：整页行投影，双栏同一水平线上的左右两栏墨迹连成一行，所有切点判据（墨块 / 空白带 / 切穿）全部失效"
  - "find_marks 按 y0 去重，左栏和右栏同高的题号被当成重复丢一半（实测 36 题只认 18 道）"
  - "左题右解（左栏题目、右栏答案）不需要支持双栏：只要在左栏的 x 范围内跑现有单栏逻辑，右栏单独存。这是一条能走的路"
  - "一页排两栏题（左右都是题）才需要真支持：列内行聚类 + 列内题号去重 + 阅读顺序改成「页内列序 × 页序」，跨栏续文也要跟着改。没有真书样本不要动"
