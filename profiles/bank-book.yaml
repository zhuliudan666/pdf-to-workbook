# 习题册 / 分类题库：几十到几百页，按章或命题点组织，题号每章重排
# 验证过的样本：某数三习题册106 页 720 题（扫描件）
id: bank-book
label: 习题册 / 分类题库（整本书都是题，按章组织）
verified: true
sample: 某数三习题册 106 页 720 题（扫描件，走 OCR）
route: scripts/segment_ocr.py（扫描件靠条带 OCR 找题号；有文本层的题库走 segment.py）
room: standard
when:
  kind: pdf
  pages: [20, 600]
  hits_per_page: [2.5, 14]
  pages_with_marks_ratio: [0.7, 1.0]
  two_col: false
expect:
  题数: 每页题号数 × 页数（±5%，差太多就是漏页）
  成品页数: 题数 ÷ 3.5 左右
accept: 题数对得上 Σ每章题数、章节层级齐（部分→命题点→题型）、qa.csv 无标记
pitfalls:
  - "整页漏掉：703 → 717 那次漏了整整一页 14 道。题数必须等于「各章题数之和」，光看总数连续不算通过；structural 的跳号只是弱信号"
  - "总数对不上不等于坏了：717 → 720 这版是补回了 5 道真丢的（题号起于 x≈26 被条带切掉、号码被认成 l / ' 的 4 与 7、「8.「」的左方括号被认成直角引号、跨命题点后题号重排被判往回走），又删掉 1 个正文里的「10.」。改这些判据之后，逐条对到原书页才敢 accept"
  - "跨页续文 25 处：一题从页底接到下一页页顶，切穿底是常态。看 qa.csv 的「切穿底」，别只看题号是否连续"
  - "扫描件的 OCR 条带必须压在题号那一栏上（ocr.strip_x0/strip_x1）。实测这本数三习题册的题号起于 x≈26，strip_x0 用 40 会整页漏 19 道；24–175 才全"
  - "content_box 左边也要跟着压到 24：题号是悬挂式印在版心外的，content_box[0]=50 时条带认得出题号、crop 却把它切掉半截（成品是「010 数学一」而不是「1.［2010 数学一」）。这一处切点全对、qa 零标记，只能对着原书才看得见"
  - "章内题号重排（每章 1..n）：structural 按 (部分,章,题型) 分组才不会误报重号。chapter 字段空着时，一本 700 题的书能报出 77 处假重号"
  - "OCR 一趟 6.3 秒/页，改切点重跑别清 ocr/ 缓存；106 页首次约 9 分钟，之后 20 秒"
