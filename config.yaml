# ============================================================
# 习题册 PDF -> 做题本  配置文件
# 改完直接跑 build.py，不用动代码
# ============================================================

# 题号识别：按顺序尝试，先命中的胜出。
# 每组正则第 0 组是整个题号，用于显示。
question_patterns:
  - '^\s*(\d+)\s*[.．、]\s*[（(]\s*(\d+)\s*[)）]'      # 4.(3) 设A=...  大题号+子题号
  - '^\s*(\d+)\s*[.．、]\s*(?=\S)'                       # 4. 设A=...     纯题号
  - '^\s*[（(]\s*(\d+)\s*[)）]\s*(?=\S)'                 # (3) 设A=...    只有子题号

# 这些行会被整行剔除（页眉、页脚、水印、广告）
ignore_patterns:
  - '^\s*B\s*站'
  - '第\s*\d+\s*页'
  - '^\s*[-—]\s*\d+\s*[-—]\s*$'
  - '^\s*\d+\s*/\s*\d+\s*$'
  # 书脚居中的页码，常见「· 2 ·」「• 2 •」「∙ 2 ∙」——不剔掉会跟最后一题焊在一起
  - '^\s*[·•∙・]\s*\d+\s*[·•∙・]\s*$'

# ---------------- 版面 ----------------
# 排版的核心是「每页几道」：先定页，再把余量均分成答题区。
# 选择题/填空题 4 道一页，解答/证明题 3 道一页；一页里混了不同题型时按
# page_quota_mixed 算（3 道），留白按 3 等分而不是按各自题型给。
page_quota:
  选择题: 4
  填空题: 4
  解答题: 3
  证明题: 3
page_quota_mixed: 3

# 答题区下限（毫米）：均分后低于这个值就先缩题图，缩到 min_scale 还不够就少放一道。
# 这是「写到一半没地方」的物理底线，不受留白档位影响。
#
# 下限不能凭手感定，得让「每页几道」这个契约排得出来。实测这本 106 页扫描件：
# 解答题题图中位 84pt（约 30mm），三道上限排下去留白中位 48mm。
# 下限若定 45mm，一半的页达不到 → 退成 2 道/页，用户要的「大题 3 道」就落空了
# （实测 38 页只排 2 道，全书 224 页）。放到 32mm 后：3 道/页从 84 页升到 92 页，
# 2 道/页从 38 页降到 24 页，全书 216 页，留白中位只掉 3mm（48→45）。
# 所以下限的取法是「刚好够写下 4 行推导」，而不是「理想留白」。
answer_gap_floor_by_section:
  选择题: 14
  填空题: 26
  解答题: 32
  证明题: 32
answer_gap_floor_mm: 30       # 章节名对不上时用
# 答题区上限（毫米）：一页题少时余量会很大，封顶后多出来的白落页底，
# 免得一道小题被拉开半页。
answer_gap_cap_by_section:
  选择题: 40
  填空题: 60
  解答题: 130
  证明题: 130
answer_gap_cap_mm: 120

# 相邻两题之间额外的间隔（毫米）
question_gap_mm: 8
# 页底呼吸位（毫米）：最后一题的答题区不贴到页脚印页码的位置。
# 这是「排版发闷」的直接来源——留白顶到纸边，看着像没留。
page_bottom_breath_mm: 6
# 题图缩放下限：为了给答题区腾地方，题图最多缩到原来的这个比例。
# 再放不下就少排一道，而不是把题缩成小字——缩过头比翻页难受。
min_scale: 0.8
# 留白样式：blank 纯白（省墨）| line 一条淡中线 | dots 淡点阵（像方格本）
# dots 会多出很多矢量圆：88 题大约多 0.5–1MB，不介意体积再用
gap_style: blank

paper:
  size: A4
  margin_top: 58
  margin_bottom: 46
  margin_left: 66      # 左侧多留，装订/打孔
  margin_right: 46
  dpi: 300             # 裁图分辨率，打印建议不低于 300

header:
  # 页眉左边：练习册名 + 做题本。留空 = 自动识别。
  # 自动识别的顺序：原书页眉上的书名（segment_ocr 抽几页 OCR 出来）→ 文件名。
  # 千万别在这里写死一个名字——写死在模板里的后果是：换成高数分册以后，
  # 页眉还印着「线代真题复盘」，一眼就知道是套别人的成品。
  book: ""
  suffix: " · 做题本"
  # 想完全自定义页眉（比如「XX 考研 · 高数分册 · 做题本」）就填 title，它优先于 book
  title: ""
  show_source_page: true    # 每题右上角标注 "原书 p37"

cross_page:
  merge_continuation: true  # 上一页末尾的题自动接上下一页页首的残余内容
  # 但「续页」有两道闸：必须物理相邻的下一页（pages 可以写离散页段 "3,6,9"），
  # 且页首第一行不能是 定义/定理/第X章/习题 —— 那种是别人家的正文开头，不是下半截。

# 章名映射：一册只有一种题的书不用写。
# 讲义、多章练习册必须写——每章都从 1 重新编号，不给章，structural 会把全书的
# 「第 1 题」当成同一道题，报出一堆假高危，真断了反而被淹掉。
# find_exercises.py --patch 会自动把这段追加进配置，不用手抄页段。
# chapters:
#   - title: 第1章 函数与极限
#     pages: 3-4
#   - title: 第2章 函数与极限
#     pages: 6-7

# 目录页：按「第X部分 / 命题点」两级生成，插在正文最前面，页码自动对上。
# 每章另起一页，章首画「部分 → 命题点 → 题型」三级标题。
# 认不出章节标题的书（没有「第X部分」「命题点」这类行）会跳过目录，只按题型分节。
toc: true
